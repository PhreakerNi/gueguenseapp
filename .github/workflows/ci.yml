          echo '```' >> $GITHUB_STEP_SUMMARY
          cat delivery_test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify Log Privacy & Sentinel Leaks
        run: |
          set -eo pipefail
          if [ -f /tmp/privacy_sentinels.txt ]; then
            while IFS= read -r sentinel; do
              if [ -n "$sentinel" ]; then
                if grep -F -q "$sentinel" edge.log 2>/dev/null || grep -F -q "$sentinel" delivery_test.log 2>/dev/null; then
                  echo "ERROR: Privacy sentinel leaked in log files!"
