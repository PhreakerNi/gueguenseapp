# Supabase CLI Local Configuration — Güegüense Monorepo
project_id = "gueguenseapp-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "gueguense-business://*",
  "gueguense-driver://*",
  "http://localhost:3000/*",
  "http://localhost:3001/*",
  "http://localhost:3002/*",
  "http://127.0.0.1:3000/*",
  "http://127.0.0.1:3001/*",
  "http://127.0.0.1:3002/*",
]

[inbucket]
enabled = true
port = 54324
